# Memoria para Gradle (evita que la compilación se quede sin memoria)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# OBLIGATORIO: el proyecto usa librerías AndroidX (Compose, Room, Navigation, DataStore)
android.useAndroidX=true

# Estilo de código Kotlin oficial
kotlin.code.style=official

# Cada módulo usa solo sus propios recursos (compila más rápido)
android.nonTransitiveRClass=true